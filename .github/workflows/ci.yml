name: CI Pipeline

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker-image:
    name: Build and push Docker image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name and tags
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          # ghcr.io requires lowercase image names.
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cs2-crosshair-bot
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "IMAGE_TAG=dev-$SHORT_SHA" >> $GITHUB_ENV
            echo "CHANNEL_TAG=dev" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=prod-$SHORT_SHA" >> $GITHUB_ENV
            echo "CHANNEL_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build \
            -f Dockerfile \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t ${IMAGE}:${IMAGE_TAG} \
            -t ${IMAGE}:${CHANNEL_TAG} \
            .
          docker push ${IMAGE}:${IMAGE_TAG}
          docker push ${IMAGE}:${CHANNEL_TAG}
